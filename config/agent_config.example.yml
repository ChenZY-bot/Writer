# 复制为 config/agent_config.yml 再填写。
# agent_config.yml 已在 .gitignore 里，永远不会被提交。
#
# 也可以不写 volc_api_key，改用环境变量 ARK_API_KEY。

# 火山引擎（Ark）API Key。留空则读环境变量 ARK_API_KEY
volc_api_key: ""

# 火山引擎推理接入点 ID（形如 ep-2026xxxxxxxx-xxxxx）
chat_model_name: "ep-xxxxxxxxxxxxx-xxxxx"

# 本地 Ollama 的向量模型；需先 `ollama pull bge-m3`
embedding_model_name: "bge-m3"
ollama_base_url: "http://localhost:11434"
